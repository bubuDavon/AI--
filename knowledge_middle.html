function render(){const r=row.value,c=col.value,f=keys.find(k=>k!==r&&k!==c),fv=filter.value;let count=0,gaps=0,nonempty=[];let html='<thead><tr><th>'+labels[r]+' / '+labels[c]+'</th>'+dims[c].map(v=>'<th>'+esc(v)+'</th>').join('')+'</tr></thead><tbody>';for(const rv of dims[r]){html+='<tr><th>'+esc(rv)+'</th>';for(const cv of dims[c]){let items=entries.filter(n=>n[r]===rv&&n[c]===cv&&(fv==='all'||n[f]===fv));count+=items.length;if(!items.length)gaps++;else nonempty.push({name:rv+' × '+cv,count:items.length});let diff=r==='difficulty'?rv:c==='difficulty'?cv:f==='difficulty'&&fv!=='all'?fv:null;let bg=diff?KSB_PALETTE.difficulty[diff]:['#fff','#f6f8ff','#eef2ff','#e3e9ff','#d4dcff'][Math.min(4,Math.ceil(items.length/3))];html+='<td style="background:'+bg+'"><div class="cellcount">'+items.length+' 个知识点 · 密度 '+(items.length>=8?'高':items.length>=3?'中':items.length?'低':'空')+'</div>';if(items.length){let groups=fv==='all'?dims[f]:[fv];for(let v of groups){let ns=items.filter(n=>n[f]===v);if(!ns.length)continue;html+='<div class="group" style="background:'+(f==='difficulty'?KSB_PALETTE.difficulty[v]:'#ffffff99')+'"><strong>'+esc(v)+'</strong>'+ns.map(n=>'<button class="atom-link" data-id="'+esc(n.id)+'">'+esc(n.name)+'</button>').join('')+'</div>'}}else html+='<div class="gap">— 当前交叉未配置知识卡<br>先核验场景需要，再决定补充。</div>';html+='</td>'}html+='</tr>'}html+='</tbody>';document.getElementById('matrix').innerHTML=html;document.querySelectorAll('#matrix [data-id]').forEach(b=>b.onclick=()=>showDetail(b.dataset.id));document.getElementById('status').textContent='当前筛选共 '+count+' / '+DATA.nodes.length+' 个知识点 · '+gaps+' 个空白交叉；每个知识点只出现一次。';nonempty.sort((a,b)=>b.count-a.count);document.getElementById('readout').innerHTML='<h2>矩阵怎么读</h2><p><b>坐标：</b>'+labels[r]+'（'+dims[r].join('、')+'） × '+labels[c]+'（'+dims[c].join('、')+'）；'+labels[f]+'为第三维筛选。难度指本岗位任务的学习复杂度，高级主要面向助教与管理员。</p><p><b>当前重点交叉：</b>'+nonempty.slice(0,3).map(x=>esc(x.name)+'（'+x.count+'）').join('；')+'。先读所在组的入门卡，再结合学习路线补齐前导。</p><p><b>盲区处理：</b>空白表示本版未配置，并不自动代表遗漏。大学生运营卡不直接套用中老年课堂；职场与机构的实际系统接入、可访问工具及数据字段，需用真实工具能力和试课记录补充。</p>';window.KSB_MATRIX_DIAGNOSTICS={row:r,col:c,filterDimension:f,filter:fv,count,gaps};}
document.getElementById('legend').innerHTML=Object.entries(KSB_PALETTE.difficulty).map(([n,c])=>'<span class="key"><i class="swatch" style="background:'+c+'"></i>'+n+'</span>').join('')+'<span>难度色优先 · 格内数量反映密度 · 点击条目阅读教学卡</span>';row.onchange=()=>sync('row');col.onchange=()=>sync('col');filter.onchange=render;sync('row');
